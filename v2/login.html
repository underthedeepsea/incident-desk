<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · 计算智算工单分析系统</title>
  <link rel="stylesheet" href="/v2/styles.css">
  <link rel="stylesheet" href="/v2/duty.css">
  <link rel="stylesheet" href="/v2/production.css">
  <script defer src="/v2/data.js"></script>
  <script defer src="/v2/login.js"></script>
</head>
<body class="login-page">
  <main class="panel login-card">
    <div class="brand account-brand">
      <span class="brand-mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 32 32" fill="none"><path d="M7 21h5.2l4-10 3.7 7H25" stroke="currentColor" stroke-width="2.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 11h5m8 10h5" stroke="currentColor" stroke-opacity=".66" stroke-width="2.4" stroke-linecap="round"/></svg></span>
      <strong><span>计算智算</span><span>工单分析系统</span></strong>
    </div>
    <h1 id="login-heading">登录工作台</h1>
    <form id="login-form" method="post" action="/api/session/login">
      <label class="editor-field"><span>账号</span><input name="username" autocomplete="username" maxlength="64" required></label>
      <label class="editor-field"><span>密码</span><input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
      <button class="button primary" type="submit">登录</button>
    </form>
    <form id="password-form" method="post" action="/api/session/password" hidden>
      <label class="editor-field"><span>当前密码</span><input name="currentPassword" type="password" autocomplete="current-password" maxlength="256" required></label>
      <label class="editor-field"><span>新密码（至少 15 个字符）</span><input name="password" type="password" autocomplete="new-password" minlength="15" maxlength="256" required></label>
      <label class="editor-field"><span>确认新密码</span><input name="confirmation" type="password" autocomplete="new-password" minlength="15" maxlength="256" required></label>
      <button class="button primary" type="submit">保存新密码</button>
      <a class="text-link" href="/v2/">返回工作台</a>
    </form>
    <p id="login-error" class="form-error" role="alert" hidden></p>
  </main>
</body>
</html>
