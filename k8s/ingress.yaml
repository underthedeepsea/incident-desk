apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-desk
spec:
  ingressClassName: internal
  tls:
    - hosts: [tickets.example.com]
      secretName: incident-desk-tls
  rules:
    - host: tickets.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: incident-desk
                port:
                  name: http
