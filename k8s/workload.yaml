apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: incident-desk-data
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: block-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-desk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-desk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-desk
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: incident-desk-image
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: incident-desk-config
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: incident-desk-data
---
apiVersion: v1
kind: Service
metadata:
  name: incident-desk
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: incident-desk
  ports:
    - name: http
      port: 8080
      targetPort: http
